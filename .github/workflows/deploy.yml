name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject cloud credentials
        run: |
          sed -i "s|'YOUR_BIN_ID_HERE'|'${{ secrets.CLOUD_BIN_ID }}'|g" index.html
          sed -i "s|'YOUR_API_KEY_HERE'|'${{ secrets.CLOUD_API_KEY }}'|g" index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
