name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject cloud credentials
        env:
          BIN_ID: ${{ secrets.CLOUD_BIN_ID }}
          API_KEY: ${{ secrets.CLOUD_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          with open('index.html', 'r') as f:
              html = f.read()
          html = html.replace("'YOUR_BIN_ID_HERE'", "'" + os.environ['BIN_ID'] + "'")
          html = html.replace("'YOUR_API_KEY_HERE'", "'" + os.environ['API_KEY'] + "'")
          with open('index.html', 'w') as f:
              f.write(html)
          PYEOF

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
